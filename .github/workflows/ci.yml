name: CI

on:
  push:
    branches:
    - main
    tags:        
      - v*
  pull_request:

jobs:
  check-required-files:
    name: Check required files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify required files exist
        run: |
          missing=()

          check() {
            local label="$1"; shift
            for f in "$@"; do
              if [ -e "$f" ]; then
                return 0
              fi
            done
            missing+=("$label")
          }

          check "LICENSE" LICENSE LICENSE.md LICENSE.txt
          check "README" README.md README README.txt
          check "AGENTS.md" AGENTS.md
          check "NuGet.config" NuGet.config nuget.config

          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required files: ${missing[*]}"
            exit 1
          fi

          echo "All required files are present."

  build:
    name: windows-latest
    needs: check-required-files
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # for minver
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
    - name: Execute build and run tests
      run: |
        dotnet build --configuration Release /nologo
        dotnet test --configuration Release
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: VolocyNazad.Revit.Sdk
        path: artifacts/*
    - name: Publish NuGet package
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        foreach($file in (Get-ChildItem "artifacts/" -Recurse -Include *.nupkg)) {
            dotnet nuget push $file --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
        }
