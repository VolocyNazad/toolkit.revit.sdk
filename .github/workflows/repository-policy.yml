name: Repository policy

on:
  push:
    branches:
    - main
    - dev
  pull_request:

concurrency:
  group: repository-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate required files, links, anchors, Solution Items and action pins
        shell: pwsh
        run: ./scripts/Validate-Repository.ps1
      - name: Verify pending changelog fragments
        shell: pwsh
        run: ./scripts/Update-Changelog.ps1 -Verify
      - name: Verify the CHANGELOG structure
        shell: pwsh
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if ($env:BRANCH -like 'release/*' -or $env:BRANCH -like 'hotfix/*') {
            ./scripts/Verify-Release.ps1 -AllowUnreleased
          } else {
            ./scripts/Verify-Release.ps1
          }
